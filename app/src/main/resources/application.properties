spring.application.name=habit_tracker

#DB Configuration

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.format_sql=true

#Authorization config

jwt.secret=${JWT_SECRET:test-secret-key-123456789012345678901234567890}
jwt.expiration=900000

refresh.token.expiration = 86400000
habit_tracker.max_failed_login_attempt.count=5
habit_tracker.account.lock.duration = 30
# Monitoring & Management

management.endpoints.web.exposure.include=health,info

#Kafka Configuration

spring.kafka.consumer.group-id=habit_tracker-group
spring.kafka.consumer.auto-offset-reset=earliest
register.kafka.message.template=user-registered-events
welcome.consumer.groupId=welcome-notification-group
failed_login.kafka.message.template=user-login-failed
login_failed.consumer.groupId=login-failed-group
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.handegunaydin.habit_tracker.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.handegunaydin.habit_tracker.dto.UserRegisterEvent
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.trusted.package=com.handegunaydin.habit_tracker.dto

spring.kafka.bootstrap-servers=localhost:9092
