server.port=8083
spring.application.name=habit_tracker
#DB Configuration
#POSTGRES
spring.datasource.url=jdbc:postgresql://localhost:5432/habitdb
spring.config.import=optional:file:./.env[.properties]
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.format_sql=true
#MONGODB
spring.mongodb.uri=mongodb://localhost:27017/audit?uuidRepresentation=standard
#Authorization config
jwt.secret=${JWT_SECRET:test-secret-key-123456789012345678901234567890}
jwt.expiration=900000
refresh.token.expiration=86400000
habit_tracker.max_failed_login_attempt.count=5
habit_tracker.account.lock.duration=30
# Monitoring & Management
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.profiles.active=local
spring.flyway.baseline-on-migrate=true
spring.mongodb.representation.uuid=standard

channel.distributor.event.topicId=channel-distributor-event
spring.kafka.trusted.package=com.handegunaydin.habit_tracker.dto
