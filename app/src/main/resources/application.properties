spring.application.name=habit_tracker
#DB Configuration
#POSTGRES
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.format_sql=true
#MONGODB
spring.mongodb.uri=${DB_URL_MONGO}
#Authorization config
jwt.secret=${JWT_SECRET:test-secret-key-123456789012345678901234567890}
jwt.expiration=900000
refresh.token.expiration=86400000
habit_tracker.max_failed_login_attempt.count=5
habit_tracker.account.lock.duration=30
# Monitoring & Management
management.endpoints.web.exposure.include=health,info
#Kafka Configuration
spring.kafka.consumer.group-id=habit_tracker-group
spring.kafka.consumer.auto-offset-reset=earliest
kafka.message.email.template=notification-events-mail
consumer.message.email.groupId=notification-group-mail
kafka.message.inapp.template=notification-events-inapp
consumer.message.inapp.groupId=notification-group-inapp
channel.distributor.event.topicId=channel-distributor-event
channel.distributor.event.groupId=channel-distributor-group
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.handegunaydin.habit_tracker.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.handegunaydin.habit_tracker.dto.UserRegisterEvent
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.trusted.package=com.handegunaydin.habit_tracker.dto
spring.kafka.bootstrap-servers=kafka:9092
spring.profiles.active=local
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_SENDER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.flyway.baseline-on-migrate=true
spring.mongodb.representation.uuid=standard
