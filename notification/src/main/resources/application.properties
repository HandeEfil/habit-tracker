server.port=8082


#POSTGRES
spring.datasource.url=jdbc:postgresql://localhost:5432/notification
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.format_sql=true
#MONGODB
spring.mongodb.uri=mongodb://localhost:27017/notification


#Kafka Configuration
spring.kafka.consumer.group-id=habit_tracker-group
spring.kafka.consumer.auto-offset-reset=earliest
kafka.message.email.template=notification-events-mail
consumer.message.email.groupId=notification-group-mail
kafka.message.inapp.template=notification-events-inapp
consumer.message.inapp.groupId=notification-group-inapp
kafka.message.dlq.template=notification-events-dlq
kafka.message.dlq.groupId=notification-group-dlq
channel.distributor.event.groupId=channel-distributor-group
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.handegunaydin.habit_tracker.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.handegunaydin.habit_tracker.dto.UserRegisterEvent
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9094}
spring.config.import=optional:file:../.env[.properties]
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_SENDER}
spring.mail.password=${EMAIL_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mongodb.representation.uuid=standard
channel.distributor.event.topicId=channel-distributor-event
spring.kafka.trusted.package=com.handegunaydin.habit_tracker.dto