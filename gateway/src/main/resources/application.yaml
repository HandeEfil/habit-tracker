server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: http://localhost:8083
              predicates:
                - Path=/api/auth/**
            - id: notifications
              uri: http://localhost:8082
              predicates:
                - Path=/notifications/**

management:
  endpoints:
    web:
      exposure:
        include: health

jwt:
  secret: ${JWT_SECRET}